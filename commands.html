<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CobblemonOasis 綠洲 - 常用指令速查</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Top Navigation -->
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-link">
        <span class="server-name-target">CobblemonOasis 綠洲</span>
        <span class="brand-badge">WIKI</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">首頁</a></li>
        <li><a href="commands.html" class="active">指令查詢</a></li>
        <li><a href="pokedex.html">寶可夢圖鑑</a></li>
        <li><a href="type-chart.html">屬性相剋</a></li>
        <li><a href="guides.html">攻略專區</a></li>
        <li><a href="donate.html">贊助支持</a></li>
      </ul>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">⌨️ 常用指令速查</h1>
      <p class="page-desc">搜尋伺服器指令、查看語法教學並一鍵複製到剪貼簿。</p>
    </div>

    <!-- Search & Filter Controls -->
    <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
      <div style="flex: 1; min-width: 240px;">
        <input type="text" id="command-search" class="card" style="width: 100%; padding: 0.65rem 1rem; border: 1px solid var(--border-color); font-size: 0.95rem; border-radius: var(--radius-md);" placeholder="🔍 搜尋指令名稱或功能關鍵字 (例如: /pc, 領地, 傳送)...">
      </div>
      <div id="category-filters" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button class="btn btn-primary active btn-sm" data-cat="all">全部</button>
        <button class="btn btn-secondary btn-sm" data-cat="個人">個人</button>
        <button class="btn btn-secondary btn-sm" data-cat="領地">領地</button>
        <button class="btn btn-secondary btn-sm" data-cat="傳送">傳送</button>
        <button class="btn btn-secondary btn-sm" data-cat="經濟">經濟</button>
        <button class="btn btn-secondary btn-sm" data-cat="VIP專屬">VIP專屬</button>
      </div>
    </div>

    <!-- Commands List Container -->
    <div id="commands-list"></div>

    <!-- Empty State -->
    <div id="commands-empty" class="empty-state" style="display: none;">
      <div class="empty-icon">⌨️</div>
      <div class="empty-title">目前尚未建立任何指令資料</div>
      <div class="empty-desc">請嘗試其他關鍵字或切換分類標籤。</div>
    </div>

  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <p>© Cobblemon Community. Minecraft is copyright Mojang AB.</p>
  </footer>

  <script src="data/database.js"></script>
  <script src="js/core.js"></script>
  <script src="js/commands.js"></script>
</body>
</html>

  <!-- Top Navigation -->
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-link">
        <span class="server-name-target">CobblemonOasis 綠洲</span>

      </ul>
      
    </div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">🧭 新手與進階攻略指南</h1>
      <p class="page-desc">學習精靈球製作、群系採集、寶可夢繁育與努力值培育機制。</p>
    </div>

    <!-- Guides List Grid -->
    <div id="guides-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;"></div>

    <!-- Empty State -->
    <div id="guides-empty" class="empty-state" style="display: none;">
      <div class="empty-icon">🧭</div>
      <div class="empty-title">目前尚未發布任何攻略文章</div>
      <div class="empty-desc">你可以至後台撰寫教學，並支援插入圖片自動歸檔至 images/guides/ 資料夾。</div>
      </div>

    <!-- Guide Reader View (Hidden by default, shown when clicking a guide) -->
    <div id="guide-reader" class="card" style="display: none; padding: 2.5rem 2rem; width: 100%; margin-bottom: 2rem;">
      <button id="guide-back-btn" class="btn btn-secondary btn-sm" style="margin-bottom: 1.5rem;">← 返回攻略清單</button>
      <h1 id="reader-title" style="font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem;"></h1>
      <div id="reader-meta" style="font-size: 0.85rem; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1.5rem;"></div>
      <div id="reader-content"></div>
    </div>

  </main>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>屬性相剋計算機 - Cobblemon 百科</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Top Navigation -->
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-link">
        <span class="server-name-target">Cobblemon 伺服器</span>
        <span class="brand-badge">WIKI</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">首頁</a></li>
        <li><a href="commands.html">指令查詢</a></li>
        <li><a href="pokedex.html">寶可夢圖鑑</a></li>
        <li><a href="type-chart.html">屬性相剋</a></li>
        <li><a href="guides.html">攻略專區</a></li>
        <li><a href="donate.html">贊助支持</a></li>
      </ul>
      
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">⚔️ 屬性相剋速查與計算機</h1>
      <p class="page-desc">選擇防守方的單屬性或雙屬性組合，即時計算所有攻擊屬性的傷害倍率。</p>
    </div>

    <!-- Calculator Selector -->
    <div class="card" style="margin-bottom: 2rem;">
      <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem;">防守方屬性配置</h2>
      <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center;">
        <div style="flex: 1; min-width: 180px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.35rem;">第一屬性 (主要)</label>
          <select id="calc-type-1" class="form-control"></select>
        </div>
        <div style="flex: 1; min-width: 180px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.35rem;">第二屬性 (副屬性 / 可選)</label>
          <select id="calc-type-2" class="form-control">
            <option value="none">無 (純單屬性)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Calculation Results -->
    <div style="margin-bottom: 3rem;">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem;">受傷倍率分析結果</h2>
      <div id="calc-results"></div>
    </div>

    <!-- Full 18x18 Matrix -->
    <div class="card">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">完整 18 屬性攻擊／防守對照矩陣</h2>
      <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1rem;">綠色「2」代表效果絕佳；紅色「½」代表效果不佳；黑色「0」代表完全免疫無效。</p>
      <div style="overflow-x: auto;">
        <table id="matrix-table" style="width: 100%; border-collapse: collapse; min-width: 760px;"></table>
      </div>
    </div>

  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <p>© Cobblemon Community. Minecraft is copyright Mojang AB.</p>
  </footer>

  <script src="js/core.js"></script>
  <script src="js/type-chart.js"></script>
</body>
</html>
